<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cours javascript1</title>
<style type="text/css">
	#bouton1 {
		position: fixed;
		top: 40px;
		left: 10px;
		z-index:10;
	}
</style>
</head>
<body>
<script type="text/javascript">
	var chiffre;
	function ma_fonction() {
		chiffre = prompt('Rentrer un chiffre :');
		document.getElementById("text").innerHTML=chiffre;
	}
</script>
<div id="bouton1"><button onclick="ma_fonction()">Rentrer un chiffre</button></div>
<div id="main">
<p>Le chiffre saisi est : <span id="text"></span></p>
</div>
</body>
</html>
